name: app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+4
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_native_splash: ^2.4.4
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/IMG-20260326-WA0010.jpg"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  background_image: "assets/icons/IMG-20260326-WA0010.jpg"
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  fullscreen: true

  android_12:
    image: "assets/icons/IMG-20260326-WA0010.jpg"
    color: "#ffffff"
